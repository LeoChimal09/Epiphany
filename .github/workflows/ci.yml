name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, and build
    runs-on: ubuntu-latest
    # No production credentials are used. The MySQL service is disposable and its password is a
    # placeholder; tests create and drop their own databases on it. The build needs no configuration.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: placeholder-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pplaceholder-ci-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Migrations match schema
        run: bun run db:check

      - name: Test
        run: bun run test:run
        env:
          TEST_MYSQL_ADMIN_URL: mysql://root:placeholder-ci-root@127.0.0.1:3306
          REQUIRE_DB_TESTS: "true"

      - name: Build
        run: bun run build
